[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-lang"
version = "0.1.0"
description = "The official Corvus programming language interpreter and compiler."
readme = "README.md"
authors = [{ name = "Saatvik Jain" }]
license = { text = "MIT" }
keywords = ["corvus", "programming-language", "compiler", "interpreter", "custom-language"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com"

[tool.setuptools]
packages = ["Interpreter", "Compiler", "Compiler_Core", "Compiler_Windows", "Compiler_Linux", "Compiler_MacOS"]
